# ============================== security 安全与逆向 ==============================
# Reverse engineering, dynamic instrumentation, vulnerability & malware analysis.
# Python system: confirm no collision with mcp 2.x FastMCP renamed - tested frida-mcp & ida-pro-mcp both collide,
# so args include --with mcp<2.

- id: jshook
  label: JS Hook
  summary: "JS analysis & security research: Hook, CDP debugging, deobfuscation"
  category: security
  vendor: jshookmcp
  access: Open source free (AGPL-3.0), local runtime; requires Node 22.12+. Tool tier controlled by MCP_TOOL_PROFILE env var (search ≈3K tokens / workflow / full ≈40K+), default tier is sufficient
  transport: stdio
  command: npx
  args: ['-y', '@jshookmcp/jshook@latest']
  homepage: https://vmoranv.github.io/jshookmcp/

- id: ida-pro
  label: IDA Pro
  summary: Drive IDA Pro for reverse analysis
  category: security
  vendor: mrexodia
  access: Requires locally installed IDA Pro; service pulls as needed, no pre-pip install required
  transport: stdio
  command: uvx
  args: ['--with', 'mcp<2', '--with', 'ida-pro-mcp', 'ida-pro-mcp']
  homepage: https://github.com/mrexodia/ida-pro-mcp

# ⚠️ `frida-mcp` this name is **two unrelated packages** on npm & PyPI:
#    PyPI `frida-mcp` (0.1.1, 2025-03) = dnakov/frida-mcp (435★, MIT, has real repo) - this is the one being collected.
#    npm `frida-mcp` (1.0.0, 2026-05) = maintainer europa6, registry has **no repository field**,
#          unreachable one-to-one source (README only points to accompanying skills repo yfe404/frida-mcp-skills),
#          and it's a pure Node package, unrelated to mcp 2.x - excluded per "unreachable source, better not collect".

- id: frida-mcp
  label: Frida
  summary: "Frida dynamic instrumentation: Hook functions, trace calls"
  category: security
  vendor: dnakov
  access: Open source free (MIT), local runtime; requires locally installed Frida & target being tested. Tested uvx startup & initialize/tools/list handshake, enumerate_processes returns machine processes normally
  transport: stdio
  command: uvx
  args: ['--with', 'mcp<2', '--with', 'frida-mcp', 'frida-mcp']
  homepage: https://github.com/dnakov/frida-mcp

