# MCP Servers Verified List (for DSH plugin "MCP Market")

> Verified as of: 2026-10 (based on online docs / npm / PyPI / official registries at that time)
> Each entry is a writable config that can connect. HTTP-type endpoints require OAuth authorization except where "no-auth" is noted.
> Category values and display order are defined by `scripts/build-catalog.mjs` CATEGORY_ORDER (not repeated here,
> to avoid a third list drifting); the physical order below is only for reading convenience, **it does not determine
> the market's chips order**.

```yaml
# ============================== search 搜索 ==============================
- id: exa
  label: Exa
  summary: Web search and content retrieval
  category: search
  vendor: Exa
  access: No-auth available (limited quota); can add x-api-key in headers to increase quota
  transport: streamable-http
  url: https://mcp.exa.ai/mcp
  headers:
    x-api-key: "!!js (process.env.EXA_API_KEY ?? \"\")"
  envKeys: [EXA_API_KEY]
  homepage: https://docs.exa.ai/reference/exa-mcp

- id: tavily
  label: Tavily
  summary: AI-optimized search & web extraction
  category: search
  vendor: Tavily
  access: No-auth mode free with rate limits (responses with key same as without); official free key is 1000 credits/month, no credit card needed
  transport: streamable-http
  url: https://mcp.tavily.com/mcp/
  headers:
    Authorization: "!!js \"Bearer \" + (process.env.TAVILY_API_KEY ?? \"\")"
    X-Tavily-Access-Mode: keyless
  envKeys: [TAVILY_API_KEY]
  homepage: https://docs.tavily.com/documentation/mcp

- id: firecrawl
  label: Firecrawl
  summary: Web crawling, search & document parsing
  category: search
  vendor: Firecrawl
  access: No-auth available (daily quota); fill API key to increase quota. Use /v2/mcp-oauth when browser login is needed
  transport: streamable-http
  url: https://mcp.firecrawl.dev/v2/mcp
  headers:
    Authorization: "!!js \"Bearer \" + (process.env.FIRECRAWL_API_KEY ?? \"\")"
  envKeys: [FIRECRAWL_API_KEY]
  homepage: https://docs.firecrawl.dev/mcp-server

- id: brave-search
  label: Brave Search
  summary: Independent index of web & local search
  category: search
  vendor: Brave
  access: Must provide your own Brave Search API Key (free tier available, pay-to-use beyond limit)
  transport: stdio
  command: npx
  args: ['-y', '@brave/brave-search-mcp-server', '--transport', 'stdio']
  envKeys: [BRAVE_API_KEY]
  homepage: https://github.com/brave/brave-search-mcp-server

- id: perplexity
  label: Perplexity
  summary: Real-time web search & deep research
  category: search
  vendor: Perplexity
  access: Requires paid Perplexity API Key (Bearer); no free quota
  transport: streamable-http
  url: https://api.perplexity.ai/mcp
  headers:
    Authorization: "!!js \"Bearer \" + (process.env.PERPLEXITY_API_KEY ?? \"\")"
  envKeys: [PERPLEXITY_API_KEY, PERPLEXITY_API_KEY]
  homepage: https://docs.perplexity.ai/docs/getting-started/integrations/mcp-server

- id: google-maps
  label: Google Maps
  summary: Google Maps platform documentation retrieval
  category: search
  vendor: Google
  access: Free experimental stage, no authentication required (tested tools/list returns 2 doc retrieval tools)
  transport: streamable-http
  url: https://mapscodeassist.googleapis.com/mcp
  homepage: https://developers.google.com/maps/ai/code-assist

- id: fetch
  label: Fetch
  summary: Fetch web pages and convert to LLM-friendly text
  category: search
  vendor: Anthropic
  access: Open source free, no key needed
  transport: stdio
  command: uvx
  args: ['mcp-server-fetch']
  homepage: https://github.com/modelcontextprotocol/servers/tree/main/src/fetch

