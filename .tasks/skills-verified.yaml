# 技能市场精选清单（DSH 插件「技能市场」用）

> 核实时间：2026-10-08（git 浅克隆读取仓库内实际文件，非网页摘要）
> 每条均为已在来源仓库中确认存在的 `SKILL.md` 技能。收录纪律：**宁可少，不可错**。
>
> **许可必须逐技能判定**（SPEC 约束 8）：同一仓库里既有 Apache-2.0，也有禁止「在服务之外
> 保留副本」的专有许可，按仓库聚合两个方向都会错。故每条都记录许可**事实**与**证据文件**，
> 「能不能装」由 `lib/skills-admission.js` 的 `classifyLicense()` 在生成目录时算出
> （**不在本文件里写 installable**——那会形成第二真相源，改了规则却漏改数据，门禁就静默失效）。
>
> 分类的取值域与展示顺序由 `scripts/build-skills-catalog.mjs` 的 `CATEGORY_ORDER` 定义
> （此处不复述，避免第三份清单漂移）；下面各段的物理顺序只为了便于阅读，**不决定市场的 chips 顺序**。
>
> `id` 用 `<owner>-<name>` 形态：技能名会**跨仓库重复**（`test-driven-development` 在
> obra/superpowers 与 github/awesome-copilot 都有），拿 name 当 id 会撞车。

```yaml
