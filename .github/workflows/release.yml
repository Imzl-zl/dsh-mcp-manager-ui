name: release

# 一次发布 = 推一个 tag。CI 依次做：校验 tag 与 version 一致 -> 跑测试 -> 发 npm -> 建 GitHub Release。
#
# npm 侧用 **trusted publishing（OIDC）**：不需要任何长期 token，
# 由 npm 用短时签名凭据认证（见 docs/installation.md 的发布流程）。
#
# 一次性准备（只需做一次）：
#   1. 包必须已存在：首次发布要在本地交互式 `npm publish`（npm 要求 2FA 挑战）。
#   2. npmjs.com -> 该包 -> Settings -> Trusted Publisher ->
#      GitHub Actions: organization/user = Imzl-zl, repository = dsh-mcp-manager-ui,
#      workflow filename = release.yml（可另填 environment）。
#   3. 之后每次发布只需要：改 version、提交、`git push origin main`、`git push origin vX.Y.Z`。
#
# 想先确认流水线本身健康（不改任何版本、不发布），手动跑一次：
#   gh workflow run release.yml --ref main -f dry_run=true
# 它会跑同样的安装 + 测试，只在最后跳过发布与建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只跑安装与测试，不发布 npm、不建 Release'
        type: boolean
        default: true

permissions:
  contents: write # gh release create
  id-token: write # npm trusted publishing（OIDC）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本漂移是发布里最常见的错误：tag 与 package.json 不一致就直接失败，
      # 不要发出一个「tag 说 1.2.2、包说 1.2.1」的版本。
      # 手动试跑（workflow_dispatch）没有 tag，跳过这项比较。
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg} — bump the version, commit, then re-tag"
            exit 1
          fi
          echo "releasing ${pkg}"

      - name: Report the version under test
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          echo "dry run on ${GITHUB_REF_NAME}: ${pkg}"

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # trusted publishing 需要 npm CLI >= 11.5.1（OIDC 支持）
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@^11

      - name: Install development dependencies
        run: pnpm install --frozen-lockfile

      # 与本地 `npm test` 同一条门槛（含真机集成用例）。
      # 若某次发布希望跳过，删掉这一步即可——发布的是已提交的预构建 lib/，没有构建步骤。
      - name: Test
        run: npm test

      # ⚠️ 已经发过的版本要**跳过**，而不是报错：
      # 一个新包名的**首个版本**必须先由维护者本地交互式发布（npm 要求包先存在，才能配置
      # trusted publisher —— 见 docs/installation.md 的一次性准备），之后为同一版本推 tag
      # 时这一步必然撞上「版本已存在」。那不是错误：CI 该做的是校验版本、跑测试、建 Release。
      # 所以先问一句 npm，已经在上面就跳过并打印一行（谁都能从日志里看出发生了什么）。
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} 已经在 npm 上（首个版本由维护者本地发布）——跳过 publish，继续建 Release"
          else
            npm publish
          fi

      # Release notes：有手写稿就用它，否则用提交生成。手写稿放在 .github/release-notes/，
      # 不放 docs/ —— docs 会随包发布到 npm。
      #
      # ⚠️ 标题里的包名**从 package.json 取，不写死**：同一个仓库里有两条产品线
      # （main 的 dsh-mcp-manager-ui 与 toolbox 线的 dsh-toolbox-ui），写死会让其中一条
      # 的 Release 标题挂上另一条的包名（v1.6.0 的稿子当初就是这么错的）。
      #
      # ⚠️⚠️ **必须带 `--prerelease`**：两条线共用一个 `releases/latest`，而老线（≤1.5.3）面板的
      # 「升级」按钮读的就是它、下发的却是**自己那个包名**的新版本。本线的 Release 一旦成为
      # "latest release"，老用户点「升级」就会去装 `dsh-mcp-manager-ui@^<本线版本>`——那个版本
      # 永远不存在，必然报错（真机验证过）。标成 pre-release 后 GitHub 的 "latest release" 会跳过
      # 它，老线的面板因此看到**旧线自己的最新版**（如 v1.5.5），点一下升到中转版、再点「迁移」过来。
      # 本线自己的更新提示不看这个 feed（问的是自己包在 npm 上的 latest），所以标 pre-release 无损。
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node -p "require('./package.json').name")"
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "${name} ${GITHUB_REF_NAME}" \
              --notes-file "$notes" --verify-tag --prerelease
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "${name} ${GITHUB_REF_NAME}" \
              --generate-notes --verify-tag --prerelease
          fi
